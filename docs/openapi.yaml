  /api/v1/files:
    post:
      tags:
      - Files
      summary: Upload a file
      operationId: POST_api_v1_files
      description: Any authenticated user. The request body is the raw file content (not multipart/form-data). The display
        name comes from X-File-Name (sanitized) and the MIME type from Content-Type. The stored MIME may be an allowlisted
        type only.
      security:
      - bearerAuth: []
      parameters:
      - name: X-File-Name
        in: header
        required: false
        schema:
          type: string
        description: Original filename (default upload.bin).
      - name: Content-Type
        in: header
        required: false
        schema:
          type: string
        description: File MIME type (default application/octet-stream).
      requestBody:
        required: true
        description: Raw file bytes.
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: File stored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Business status code; 0 means success.
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/FileObject'
                required:
                - code
                - msg
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags:
      - Files
      summary: List files
      operationId: GET_api_v1_files
      description: Admins see all files (optionally filtered by tenant_id); regular users see only their own files in their
        tenant.
      security:
      - bearerAuth: []
      parameters:
      - name: tenant_id
        in: query
        required: false
        schema:
          type: integer
          format: int64
        description: Admin-only tenant filter (others are forced to their own tenant).
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - name
          - size_bytes
          - created_at
        description: 'Sort column whitelist: name, size_bytes, created_at.'
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
        description: Sort direction.
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
        description: 1-based page index.
      - name: page_size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Items per page (clamped to 1..100).
      responses:
        '200':
          description: Paginated result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Business status code; 0 means success.
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/FileObject'
                      total:
                        type: integer
                        format: int64
                      page:
                        type: integer
                        format: int64
                      pageSize:
                        type: integer
                        format: int64
                    required:
                    - list
                    - total
                    - page
                    - pageSize
                required:
                - code
                - msg
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
