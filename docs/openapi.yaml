      - id
      - tenant_id
      - subject_id
      - resource
      - action
      - decision
      - source
      - policy_id
      - created_at
  responses:
    BadRequest:
      description: Malformed request body or invalid parameters.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 'Missing, malformed, expired, or revoked Bearer token (JWT middleware envelope: code 401, msg "Unauthorized").'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 'Authenticated but not allowed (for admin-only routes: not an admin; for file routes: not the owner).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: The request conflicts with existing state (e.g. duplicate email or already-processed approval).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PayloadTooLarge:
      description: Uploaded file exceeds the configured size limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: Per-client-IP rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    InternalServerError:
      description: Unexpected server-side error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    BadGateway:
      description: Upstream AI provider or IdP call failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: Dependency unavailable (database probe failed, AI provider missing, or AI circuit open).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
paths:
  /health/live:
    get:
      tags:
      - Health & Metrics
      summary: Liveness probe (server root)
      operationId: GET_health_live
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Business status code; 0 means success.
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/HealthStatus'
                required:
                - code
                - msg
                - data
  /api/v1/health/live:
    get:
      tags:
      - Health & Metrics
      summary: Liveness probe (API prefix)
      operationId: GET_api_v1_health_live
      security: []
      responses:
        '200':
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Business status code; 0 means success.
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/HealthStatus'
                required:
                - code
                - msg
                - data
  /api/v1/health/ready:
    get:
      tags:
      - Health & Metrics
      summary: Readiness probe
      operationId: GET_api_v1_health_ready
      description: Runs a database read; returns 503 when the data store is unavailable.
      security: []
      responses:
        '200':
          description: Database is reachable.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Business status code; 0 means success.
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/HealthStatus'
                required:
                - code
                - msg
                - data
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /metrics:
    get:
      tags:
      - Health & Metrics
      summary: Prometheus metrics
      operationId: GET_metrics
      description: Prometheus text exposition format. Public by default; when ZASDOOR_METRICS_ALLOW_IPS is set, only requests
        from those exact client IPs (comma-separated) are allowed.
      security: []
      responses:
        '200':
          description: Prometheus metrics.
          content:
            text/plain:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Register a new account
      operationId: POST_api_v1_auth_register
      description: Creates a user in the default tenant, returns a JWT session, and queues a verification email. Public and
        rate-limited per client IP (token bucket); returns 429 when exhausted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registration succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Business status code; 0 means success.
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/LoginResult'
                required:
                - code
                - msg
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Log in with email and password
      operationId: POST_api_v1_auth_login
      description: Returns a JWT session. Repeated failures lock the account (429). Public and rate-limited per client IP
        (token bucket); returns 429 when exhausted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Business status code; 0 means success.
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/LoginResult'
                required:
                - code
                - msg
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Log out (client-side token discard)
      operationId: POST_api_v1_auth_logout
      description: 'Stateless JWT implementation: always returns success; the client discards the token. Public and rate-limited
        per client IP (token bucket); returns 429 when exhausted.'
      security: []
      responses:
        '200':
          description: Always succeeds.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Business status code; 0 means success.
                  msg:
                    type: string
                  data:
                    type: 'null'
                required:
                - code
                - msg
                - data
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/forgot-password:
    post:
      tags:
      - Auth
      summary: Request a password-reset email
      operationId: POST_api_v1_auth_forgot_password
      description: Always responds success to avoid user enumeration; a reset link is emailed only when the address exists.
        Public and rate-limited per client IP (token bucket); returns 429 when exhausted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset link queued if the account exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Business status code; 0 means success.
                  msg:
                    type: string
                  data:
                    type: 'null'
                required:
                - code
                - msg
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/auth/reset-password:
    post:
      tags:
      - Auth
      summary: Reset a password with a reset token
      operationId: POST_api_v1_auth_reset_password
      description: Public and rate-limited per client IP (token bucket); returns 429 when exhausted.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset; log in again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: Business status code; 0 means success.
                  msg:
