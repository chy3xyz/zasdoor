  /oauth/authorize:
    get:
      tags:
      - OAuth2 / OIDC
      summary: OAuth2 authorization endpoint
      operationId: GET_oauth_authorize
      description: Requires a Bearer token identifying the resource owner. When consent has not been granted, returns an envelope
        with msg consent_required; repeat with consent_granted=true to receive a 302 redirect carrying the authorization code.
      security:
      - bearerAuth: []
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: OAuth client id of an IAM application.
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
        description: Registered redirect URI.
      - name: response_type
        in: query
        required: false
        schema:
          type: string
        description: Response type; only `code` is supported (default code).
      - name: scope
        in: query
        required: false
        schema:
          type: string
        description: Requested scopes, space-separated (default openid).
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: Opaque value echoed back in the redirect.
      - name: nonce
        in: query
        required: false
        schema:
          type: string
        description: OIDC nonce, embedded in the id_token.
      - name: code_challenge
        in: query
        required: false
        schema:
          type: string
        description: PKCE code challenge.
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
          enum:
          - plain
          - S256
        description: 'PKCE method: plain or S256.'
      - name: consent_granted
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - '1'
          - 'yes'
          - 'false'
        description: Set true to grant requested scopes after a consent_required response. On POST it may also be sent as
          a form field.
      responses:
        '200':
          description: Consent required envelope (retry with consent_granted=true).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthConsentRequired'
        '302':
          description: Authorization code issued; redirect to redirect_uri?code=...&state=....
          headers:
            Location:
              schema:
                type: string
              description: redirect_uri with code and optional state.
        '400':
          description: OAuth2 error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: 'OAuth2 error: login required (Authorization Bearer token for the resource owner is required).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
    post:
      tags:
      - OAuth2 / OIDC
      summary: OAuth2 authorization endpoint (POST)
      operationId: POST_oauth_authorize
      description: Same as GET; the handler still reads client_id/redirect_uri/scope/etc. from the query string. consent_granted
        may be supplied as a form field.
      security:
      - bearerAuth: []
      parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
        description: OAuth client id of an IAM application.
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
        description: Registered redirect URI.
      - name: response_type
        in: query
        required: false
        schema:
          type: string
        description: Response type; only `code` is supported (default code).
      - name: scope
        in: query
        required: false
        schema:
          type: string
        description: Requested scopes, space-separated (default openid).
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: Opaque value echoed back in the redirect.
      - name: nonce
        in: query
        required: false
        schema:
          type: string
        description: OIDC nonce, embedded in the id_token.
      - name: code_challenge
        in: query
        required: false
        schema:
          type: string
        description: PKCE code challenge.
      - name: code_challenge_method
        in: query
        required: false
        schema:
          type: string
          enum:
          - plain
          - S256
        description: 'PKCE method: plain or S256.'
      - name: consent_granted
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - '1'
          - 'yes'
          - 'false'
        description: Set true to grant requested scopes after a consent_required response. On POST it may also be sent as
          a form field.
      responses:
        '200':
          description: Consent required envelope (retry with consent_granted=true).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthConsentRequired'
        '302':
          description: Authorization code issued; redirect to redirect_uri?code=...&state=....
          headers:
            Location:
              schema:
                type: string
              description: redirect_uri with code and optional state.
        '400':
          description: OAuth2 error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: 'OAuth2 error: login required (Authorization Bearer token for the resource owner is required).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /oauth/token:
    post:
      tags:
      - OAuth2 / OIDC
      summary: Token endpoint (all grants)
      operationId: POST_oauth_token
      description: 'Accepts application/x-www-form-urlencoded. Supported grant_type values: authorization_code (PKCE via code_verifier),
        client_credentials, refresh_token, urn:ietf:params:oauth:grant-type:device_code, and urn:ietf:params:oauth:grant-type:token-exchange
        (RFC 8693; subject_token/subject_token_type required, optional actor_token/actor_token_type/requested_token_type/audience).
        Client credentials are read from the form (client_secret_post); client_secret_basic is not parsed by this handler
        even though discovery advertises it. Response is raw OAuth JSON, not the envelope.'
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthTokenRequest'
      responses:
        '200':
          description: Token response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthTokenResponse'
        '400':
          description: OAuth2 error (invalid_request, invalid_grant, unsupported_grant_type, invalid_scope, authorization_pending,
            slow_down, access_denied, expired_token).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: OAuth2 invalid_client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '500':
          description: OAuth2 server_error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /oauth/introspect:
    post:
