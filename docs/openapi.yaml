            text/plain:
              schema:
                type: string
  /oauth/userinfo:
    get:
      tags:
      - OAuth2 / OIDC
      summary: OIDC userinfo
      operationId: GET_oauth_userinfo
      description: 'Requires a valid Bearer token. phone/address claims are returned only when the token scope contains phone/address
        and the values exist. Errors are empty text bodies with WWW-Authenticate: Bearer.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: UserInfo claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthUserInfo'
        '400':
          description: Token subject is invalid or the user does not exist (empty body).
          content:
            text/plain:
              schema:
                type: string
        '401':
          description: Missing/invalid token (empty body).
          headers:
            WWW-Authenticate:
              schema:
                type: string
              description: Bearer
          content:
            text/plain:
              schema:
                type: string
  /oauth/end-session:
    get:
      tags:
      - OAuth2 / OIDC
      summary: RP-initiated logout
      operationId: GET_oauth_end_session
      description: Revokes the user's sessions (token-version bump) when id_token_hint identifies a user. With a registered
        post_logout_redirect_uri returns 302; otherwise returns a JSON envelope.
      security: []
      parameters:
      - name: post_logout_redirect_uri
        in: query
        required: false
        schema:
          type: string
        description: Registered post-logout redirect URI; when present it must be registered for the client, otherwise 400.
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: Opaque value appended to the post-logout redirect.
      - name: client_id
        in: query
        required: false
        schema:
          type: string
        description: Client id owning the post-logout redirect URI.
      - name: id_token_hint
        in: query
        required: false
        schema:
          type: string
        description: ID token used to identify the user; its subject's token version is bumped (sessions invalidated).
      responses:
        '200':
          description: Logged out (JSON envelope).
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: 'null'
                required:
                - code
                - msg
                - data
        '302':
          description: Redirect to the registered post-logout URI.
          headers:
            Location:
              schema:
                type: string
              description: post_logout_redirect_uri with optional state.
        '400':
          description: OAuth2 error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
    post:
      tags:
      - OAuth2 / OIDC
      summary: RP-initiated logout (POST)
      operationId: POST_oauth_end_session
      description: Same as GET; parameters may be sent as form fields or query parameters.
      security: []
      parameters:
      - name: post_logout_redirect_uri
        in: query
        required: false
        schema:
          type: string
        description: Registered post-logout redirect URI; when present it must be registered for the client, otherwise 400.
      - name: state
        in: query
        required: false
        schema:
          type: string
        description: Opaque value appended to the post-logout redirect.
      - name: client_id
        in: query
        required: false
        schema:
          type: string
        description: Client id owning the post-logout redirect URI.
      - name: id_token_hint
        in: query
        required: false
        schema:
          type: string
        description: ID token used to identify the user; its subject's token version is bumped (sessions invalidated).
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                post_logout_redirect_uri:
                  type: string
                state:
                  type: string
                client_id:
                  type: string
                id_token_hint:
                  type: string
      responses:
        '200':
          description: Logged out (JSON envelope).
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: 'null'
                required:
                - code
                - msg
                - data
        '302':
          description: Redirect to the registered post-logout URI.
          headers:
            Location:
              schema:
                type: string
        '400':
          description: OAuth2 error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
