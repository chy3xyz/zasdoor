    post:
      tags:
      - AI
      summary: Send a chat message
      operationId: POST_api_v1_ai_sessions_id_chat
      description: 'Any authenticated user; the session must belong to the caller. With `Accept: text/event-stream` the response
        is an SSE stream (`reasoning`, `delta`, then `done` events; `error` on failure). Otherwise a JSON envelope is returned.
        Enforces a per-user daily run limit (429) and an AI-provider circuit breaker (503).'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Session ID.
      - name: Accept
        in: header
        required: false
        schema:
          type: string
          enum:
          - application/json
          - text/event-stream
        description: Set to text/event-stream to receive an SSE stream.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiChatRequest'
      responses:
        '200':
          description: JSON chat result, or an SSE stream when Accept is text/event-stream.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    $ref: '#/components/schemas/AiChatResult'
                required:
                - code
                - msg
                - data
            text/event-stream:
              schema:
                type: string
                description: 'SSE events: `reasoning` (reasoning delta), `delta` (answer delta), `done` (JSON {answer,reasoning_content,budget_exhausted}),
                  `error` (message).'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
