      summary: Device authorization (RFC 8628)
      operationId: POST_oauth_device_authorization
      description: Accepts application/x-www-form-urlencoded. Starts a device grant and returns device_code, user_code and
        verification URIs. Response is raw OAuth JSON.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthDeviceAuthorizationRequest'
      responses:
        '200':
          description: Device authorization response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthDeviceAuthorization'
        '400':
          description: OAuth2 error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /oauth/device:
    post:
      tags:
      - OAuth2 / OIDC
      summary: Approve or deny a device grant
      operationId: POST_oauth_device
      description: Requires a Bearer token (the signed-in user approving the device). Parameters may be form fields or query
        parameters. approve defaults to true; deny=true takes precedence and denies. Returns a JSON envelope.
      security:
      - bearerAuth: []
      parameters:
      - name: user_code
        in: query
        required: false
        schema:
          type: string
        description: User code shown on the device.
      - name: approve
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - '1'
          - 'yes'
          - 'false'
        description: true/1/yes to approve (default true).
      - name: deny
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'true'
          - '1'
          - 'yes'
          - 'false'
        description: true/1/yes to deny.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OAuthDeviceConfirmRequest'
      responses:
        '200':
          description: Device grant resolved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: 'null'
                required:
                - code
                - msg
                - data
        '400':
          description: OAuth2 error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        '401':
          description: 'OAuth2 error: login required.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
  /api/v1/iam/authz/decisions:
    get:
      tags:
      - Authorization
      summary: List recent authorization decisions
      operationId: GET_api_v1_iam_authz_decisions
      description: Admin only; non-admin users receive 403. Returns the most recent 100 decision records, newest first.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Decision log.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthzDecision'
                required:
                - code
                - msg
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/iam/authz/policies:
    get:
      tags:
      - Authorization
      summary: List authorization policies
      operationId: GET_api_v1_iam_authz_policies
      description: Admin only; non-admin users receive 403. Returns the policies from the IAM policy store.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Policy list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuthzPolicy'
                required:
                - code
                - msg
                - data
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
      - Authorization
      summary: Create an authorization policy
      operationId: POST_api_v1_iam_authz_policies
      description: 'Admin only; non-admin users receive 403. effect must be allow or deny; name/subject/resource/action must
        be non-empty. Defaults: effect=allow, subject/resource/action="*", priority=0, enabled=true, tenant_id=1.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthzPolicyRequest'
      responses:
        '200':
          description: Policy created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        format: int64
                    required:
                    - id
                required:
                - code
                - msg
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v1/iam/authz/policies/{id}:
    put:
      tags:
      - Authorization
      summary: Update an authorization policy
      operationId: PUT_api_v1_iam_authz_policies_id
      description: Admin only; non-admin users receive 403. Partial update; omitted fields keep their current values.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Policy ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthzPolicyPatch'
      responses:
        '200':
          description: Policy updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
      - Authorization
      summary: Delete an authorization policy
      operationId: DELETE_api_v1_iam_authz_policies_id
      description: Admin only; non-admin users receive 403.
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
        description: Policy ID.
      responses:
        '200':
          description: Policy deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: 'null'
                required:
                - code
                - msg
                - data
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
