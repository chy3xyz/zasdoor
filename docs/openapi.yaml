openapi: 3.1.0
info:
  title: Zasdoor HTTP API
  version: 0.4.0
  summary: 'Admin framework API: auth, users, IAM/OAuth2/OIDC, MFA/WebAuthn, Web3, agents, AI, files, tasks and operations.'
  description: 'Complete HTTP surface derived from the Zig route registrations in `src/main.zig` and `src/modules/*/api.zig`.


    ## Path layout

    - The admin JSON API lives under the `/api/v1` prefix on the server root (default `http://127.0.0.1:8000`).

    - OAuth2/OIDC protocol endpoints (`/oauth/*`, `/.well-known/*`), `/health/live` and `/metrics` live at the server root
    (no `/api/v1` prefix).


    ## Response envelopes

    Most endpoints return `{"code":<int>,"msg":"<string>","data":<any>}` where `code` 0 means success. Paginated endpoints
    put `{list,total,page,pageSize}` in `data`. Errors use the same envelope with `data:null` and the numeric `code` normally
    equal to the HTTP status.


    Raw (non-enveloped) responses: OAuth2/OIDC protocol endpoints (RFC 6749/8414/7662/7009/8628/8693 and OIDC), WebAuthn `begin`
    option objects, `/metrics`, CSV exports, file downloads and AI SSE streams.


    ## Authentication

    Routes marked with `bearerAuth` need `Authorization: Bearer <JWT>`. The JWT carries `sub` (user id), `roles`, `aud` (tenant
    id) and `ver` (token version); the server also checks `ver` against the database, so password changes and session revocation
    invalidate old tokens immediately. Admin-only routes additionally check the user''s `admin` flag in the database and return
    403 for non-admins.


    Rate limiting: `/auth/*` public routes and WebAuthn passkey login are limited per client IP and return 429 when exhausted.


    Pagination query parameters are `page` (1-based, default 1) and `page_size` (default 20, clamped per endpoint).'
  license:
    name: MIT
servers:
- url: http://127.0.0.1:8000
  description: Local server root. Admin JSON paths include the `/api/v1` prefix; OAuth2/OIDC, `/health/live` and `/metrics`
    are root-level. Port and issuer are configurable (ZASDOOR_HTTP_PORT, ZASDOOR_APP_HOST).
tags:
- name: Health & Metrics
  description: Liveness/readiness and Prometheus metrics.
- name: Auth
  description: Registration, login, email verification, password reset and self-service profile.
- name: Users
  description: Admin user management.
- name: Tenants
  description: Admin tenant management.
- name: Email Templates
  description: Admin-editable transactional email templates.
- name: Tasks
  description: Durable background task queue administration.
- name: Files
  description: Upload, list, download and delete files.
- name: Notifications
  description: Per-user notification inbox.
- name: Audit Logs
  description: Audit trail query and CSV export.
- name: System
  description: Runtime diagnostics and dashboard counters.
- name: IAM
  description: Organizations, projects, applications (OAuth clients), roles, role assignments and sessions.
- name: Authorization
  description: RBAC + policy decisions and authorization-policy management.
- name: MFA
  description: TOTP enrollment/verification, recovery codes and tenant MFA policy.
- name: Identity Providers
  description: Federated/social login provider management and the browser login flow.
- name: WebAuthn
  description: Passkey registration and login (ES256, attestation fmt=none).
- name: Web3
  description: 'Sign-In With Ethereum: nonces, signature verification and wallet binding.'
- name: Agents
  description: Machine identities, token issuance and token verification.
- name: AI
  description: AI provider administration, chat sessions, approvals, runs, metrics and skills.
- name: OAuth2 / OIDC
  description: OAuth2/OIDC protocol endpoints served at the server root.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT issued by /api/v1/auth/login, /api/v1/auth/register, /api/v1/mfa/webauthn/login/finish, /api/v1/web3/siwe/verify
        or the IdP callback.
  schemas:
    Envelope:
      type: object
      properties:
        code:
          type: integer
          examples:
          - 0
        msg:
          type: string
        data:
          anyOf:
          - {}
          - type: 'null'
      required:
      - code
      - msg
      - data
    ErrorEnvelope:
      type: object
      properties:
        code:
          type: integer
          examples:
          - 400
        msg:
          type: string
        data:
          type: 'null'
      required:
      - code
      - msg
      - data
    PagedData:
      type: object
      properties:
        list:
          type: array
          items: {}
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
      required:
      - list
      - total
      - page
      - pageSize
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          enum:
          - UP
          - READY
      required:
      - status
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        verified:
          type: boolean
        admin:
          type: boolean
        tenant_id:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
      required:
      - id
      - name
      - email
      - verified
      - admin
      - tenant_id
      - created_at
      - updated_at
    LoginResult:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
      - token
      - user
    TaskStatusCounts:
      type: object
      properties:
        pending:
          type: integer
          format: int64
        claimed:
          type: integer
          format: int64
        done:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        canceled:
          type: integer
          format: int64
      required:
      - pending
      - claimed
      - done
      - failed
      - canceled
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        payload:
          type: string
        status:
          type: string
        tenant_id:
          type: integer
          format: int64
        attempts:
          type: integer
          format: int64
        max_attempts:
          type: integer
          format: int64
        last_error:
          type: string
        available_at:
          type: integer
          format: int64
        started_at:
          type: integer
          format: int64
        finished_at:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
      required:
      - id
      - name
      - payload
      - status
      - tenant_id
      - attempts
      - max_attempts
      - last_error
      - available_at
      - started_at
      - finished_at
      - created_at
      - updated_at
    Notification:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        body:
          type: string
        read:
          type: boolean
        kind:
          type: string
        created_at:
          type: integer
          format: int64
      required:
      - id
      - title
      - body
      - read
      - kind
      - created_at
    FileObject:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        mime:
          type: string
        size_bytes:
          type: integer
          format: int64
        uploader_id:
          type: integer
          format: int64
        tenant_id:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64
      required:
      - id
      - name
      - mime
      - size_bytes
      - uploader_id
      - tenant_id
      - created_at
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        actor_user_id:
          type: integer
          format: int64
        actor_name:
          type: string
        action:
          type: string
        target_type:
          type: string
        target_id:
          type: integer
          format: int64
        detail:
          type: string
        ip:
          type: string
        success:
          type: boolean
        created_at:
          type: integer
          format: int64
      required:
      - id
      - actor_user_id
      - actor_name
      - action
      - target_type
      - target_id
      - detail
      - ip
      - success
      - created_at
    Tenant:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - disabled
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
      required:
      - id
      - name
      - status
      - created_at
      - updated_at
    MailTemplate:
      type: object
      properties:
        code:
          type: string
        subject:
          type: string
        body:
          type: string
        updated_at:
          type: integer
          format: int64
      required:
      - code
      - subject
      - body
      - updated_at
    SystemInfo:
      type: object
      properties:
        app:
          type: string
        version:
          type: string
        uptime_seconds:
          type: integer
          format: int64
        db:
          type: string
        mail:
          type: object
          properties:
            smtp:
              type: boolean
            console:
              type: boolean
          required:
          - smtp
          - console
        cache_entries:
          type: integer
          format: int64
        modules:
          type: integer
          format: int64
        tasks:
          $ref: '#/components/schemas/TaskStatusCounts'
      required:
      - app
      - version
      - uptime_seconds
      - db
      - mail
      - cache_entries
      - modules
      - tasks
    SystemDashboard:
      type: object
      properties:
        users:
          type: object
          properties:
            total:
              type: integer
              format: int64
            registered_last_7d:
              type: array
              items:
                type: integer
                format: int64
          required:
          - total
          - registered_last_7d
        tasks:
          $ref: '#/components/schemas/TaskStatusCounts'
        files:
          type: integer
          format: int64
        notifications:
          type: integer
          format: int64
        tenants:
          type: integer
          format: int64
        cache_entries:
          type: integer
          format: int64
      required:
      - users
      - tasks
      - files
      - notifications
      - tenants
      - cache_entries
    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - name
      - email
      - password
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
      - email
      - password
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    ResetPasswordRequest:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        token:
          type: string
        new_password:
          type: string
      required:
      - user_id
      - token
      - new_password
    VerifyEmailRequest:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        token:
          type: string
      required:
      - user_id
      - token
    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
      required:
      - old_password
      - new_password
    CreateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        admin:
          type: boolean
        tenant_id:
          type: integer
          format: int64
      required:
      - name
      - email
      - password
    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        verified:
          type: boolean
        admin:
          type: boolean
    CreateTenantRequest:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    UpdateTenantRequest:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - active
          - disabled
    UpsertMailTemplateRequest:
      type: object
      properties:
        subject:
          type: string
        body:
          type: string
      required:
      - subject
      - body
    Organization:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        domain:
          type: string
        active:
          type: boolean
        created_at:
          type: integer
          format: int64
      required:
      - id
      - name
      - description
      - domain
      - active
      - created_at
    Project:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        active:
          type: boolean
        created_at:
          type: integer
          format: int64
      required:
      - id
      - name
      - description
      - active
      - created_at
    Application:
      type: object
      properties:
        id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
        client_id:
          type: string
        redirect_uris:
          type: string
        grant_types:
          type: string
        response_types:
          type: string
        scopes:
          type: string
        access_token_ttl:
          type: integer
          format: int64
        refresh_token_ttl:
          type: integer
          format: int64
        pkce_required:
          type: boolean
        active:
          type: boolean
      required:
      - id
      - project_id
      - name
      - type
      - client_id
      - redirect_uris
      - grant_types
      - response_types
      - scopes
      - access_token_ttl
      - refresh_token_ttl
      - pkce_required
      - active
    Role:
      type: object
      properties:
        id:
          type: integer
          format: int64
        project_id:
          type: integer
          format: int64
        key:
          type: string
        name:
          type: string
        permissions:
          type: string
      required:
      - id
      - project_id
      - key
      - name
      - permissions
    IamSession:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
        client_id:
          type: integer
          format: int64
        device_id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        auth_method:
          type: string
        last_seen_at:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        revoked_at:
          type: integer
          format: int64
      required:
      - id
      - user_id
      - client_id
      - device_id
      - ip
      - user_agent
      - auth_method
      - last_seen_at
      - expires_at
      - revoked_at
    AuthzCheckRequest:
      type: object
      properties:
        subject_id:
          type: integer
          format: int64
        resource:
          type: string
        action:
          type: string
        project_id:
          type: integer
          format: int64
        resource_id:
          type: integer
          format: int64
        tenant_id:
          type: integer
          format: int64
      required:
      - subject_id
      - resource
      - action
    AuthzCheckResult:
      type: object
      properties:
        allowed:
          type: boolean
        decision:
          type: string
          enum:
          - allow
          - deny
          - unknown
        source:
          type: string
          enum:
          - none
          - role
          - policy
        policy_id:
          anyOf:
          - type: integer
            format: int64
          - type: 'null'
      required:
      - allowed
      - decision
      - source
      - policy_id
    MfaPolicy:
      type: object
      properties:
        require_mfa:
          type: boolean
        allow_recovery_codes:
          type: boolean
        allow_totp:
          type: boolean
      required:
      - require_mfa
      - allow_recovery_codes
      - allow_totp
    MfaPolicyUpdateRequest:
      type: object
      properties:
        require_mfa:
          type: boolean
        allow_recovery_codes:
          type: boolean
        allow_totp:
          type: boolean
    MfaCodeRequest:
      type: object
      properties:
        code:
          type: string
      required:
      - code
    MfaVerifyFactorRequest:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        code:
          type: string
      required:
      - user_id
      - code
    WebauthnCredential:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        credential_id:
          type: string
        last_used_at:
          type: integer
          format: int64
      required:
      - id
      - name
      - credential_id
      - last_used_at
    WebauthnCredentialDescriptor:
      type: object
      properties:
        type:
          type: string
          const: public-key
        id:
          type: string
      required:
      - type
      - id
    WebauthnPubKeyCredParam:
      type: object
      properties:
        type:
          type: string
          const: public-key
        alg:
          type: integer
          const: -7
      required:
      - type
      - alg
    WebauthnCreationOptions:
      type: object
      properties:
        rp:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
          required:
          - id
          - name
        user:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            displayName:
              type: string
          required:
          - id
          - name
          - displayName
        challenge:
          type: string
        pubKeyCredParams:
          type: array
          items:
            $ref: '#/components/schemas/WebauthnPubKeyCredParam'
        timeout:
          type: integer
          format: int64
        attestation:
          type: string
          const: none
        excludeCredentials:
          type: array
          items:
            $ref: '#/components/schemas/WebauthnCredentialDescriptor'
      required:
      - rp
      - user
      - challenge
      - pubKeyCredParams
      - timeout
      - attestation
      - excludeCredentials
    WebauthnRequestOptions:
      type: object
      properties:
        challenge:
          type: string
        rpId:
          type: string
        timeout:
          type: integer
          format: int64
        allowCredentials:
          type: array
          items:
            $ref: '#/components/schemas/WebauthnCredentialDescriptor'
        userVerification:
          type: string
          const: preferred
      required:
      - challenge
      - rpId
      - timeout
      - allowCredentials
      - userVerification
    WebauthnLoginBeginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    WebauthnFinishRegistrationRequest:
      type: object
      properties:
        credential_id:
          type: string
        client_data_json:
          type: string
        attestation_object:
          type: string
        name:
          type: string
      required:
      - credential_id
      - client_data_json
      - attestation_object
    WebauthnFinishLoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        credential_id:
          type: string
        client_data_json:
          type: string
        authenticator_data:
          type: string
        signature:
          type: string
      required:
      - email
      - credential_id
      - client_data_json
      - authenticator_data
      - signature
    Idp:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        provider_type:
          type: string
        enabled:
          type: boolean
      required:
      - id
      - name
      - provider_type
      - enabled
    IdpStartRequest:
      type: object
      properties:
        redirect_to:
          type: string
    IdpStartResult:
      type: object
      properties:
        authorize_url:
          type: string
        state:
          type: string
      required:
      - authorize_url
      - state
    IdpCallbackUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
        admin:
          type: boolean
        tenant_id:
          type: integer
          format: int64
        verified:
          type: boolean
          description: Also returned by /mfa/webauthn/login/finish.
        created_at:
          type: integer
          format: int64
          description: Also returned by /mfa/webauthn/login/finish.
        updated_at:
          type: integer
          format: int64
          description: Also returned by /mfa/webauthn/login/finish.
      required:
      - id
      - name
      - email
      - admin
      - tenant_id
    IdpCallbackResult:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/IdpCallbackUser'
      required:
      - token
      - user
    CreateIdpRequest:
      type: object
      properties:
        name:
          type: string
        provider_type:
          type: string
        config:
          type: string
      required:
      - name
      - provider_type
      - config
    IdpLinkRequest:
      type: object
      properties:
        config_json:
          type: string
        state:
          type: string
        code_challenge:
          type: string
      required:
      - config_json
      - state
    Web3NonceRequest:
      type: object
      properties:
        address:
          type: string
        domain:
          type: string
      required:
      - address
      - domain
    Web3NonceResult:
      type: object
      properties:
        nonce:
          type: string
        ttl:
          type: integer
          format: int64
      required:
      - nonce
      - ttl
    Web3VerifyRequest:
      type: object
      properties:
        message:
          type: string
        signature:
          type: string
        domain:
          type: string
      required:
      - message
      - signature
      - domain
    Web3VerifyResult:
      type: object
      properties:
        token:
          anyOf:
          - type: string
          - type: 'null'
        user_id:
          type: integer
          format: int64
        needs_bind:
          type: boolean
      required:
      - token
      - user_id
    Web3BindRequest:
      type: object
      properties:
        chain:
          type: string
        address:
          type: string
      required:
      - chain
      - address
    Web3BindResult:
      type: object
      properties:
        address:
          type: string
        chain:
          type: string
      required:
      - address
      - chain
    Agent:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        owner_user_id:
          type: integer
          format: int64
        budget:
          type: integer
          format: int64
        budget_period_seconds:
          type: integer
          format: int64
        expires_at:
          type: integer
          format: int64
        active:
          type: boolean
      required:
      - id
      - name
      - owner_user_id
      - budget
      - budget_period_seconds
      - expires_at
      - active
    CreateAgentRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
