    AuthzPolicyRequest:
      type: object
      properties:
        name:
          type: string
        effect:
          type: string
          enum:
          - allow
          - deny
          description: Defaults to allow.
        subject:
          type: string
          description: Subject selector; "*" matches all. Defaults to "*".
        resource:
          type: string
          description: Resource selector with "*" wildcard. Defaults to "*".
        action:
          type: string
          description: Action selector with "*" wildcard. Defaults to "*".
        condition:
          type: string
          description: Optional JSON object with integer org_id/project_id/resource_id constraints; empty means always applies.
