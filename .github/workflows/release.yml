name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # zigmodu/zent are pinned by hash in build.zig.zon (.url deps), so the
      # build fetches them itself — no sibling checkout layout needed.

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build backend (ReleaseSafe)
        run: |
          zig build -Doptimize=ReleaseSafe --summary all
          zig build --summary all

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm run build

      - name: Package artifacts
        run: |
          set -euo pipefail
          BIN="$GITHUB_WORKSPACE/zig-out/bin"
          mkdir -p dist
          cp "$BIN/zasdoor" "$BIN/zasdoor-admin" dist/
          tar -czf dist/zasdoor-web-dist.tar.gz -C web/dist .
          ls -l dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/zasdoor
            dist/zasdoor-admin
            dist/zasdoor-web-dist.tar.gz