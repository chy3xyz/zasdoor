name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (zig build test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # zigmodu/zent are pinned by hash in build.zig.zon (.url deps), so the
      # build fetches them itself — no sibling checkout layout needed.
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.17.0
      - name: Zig format check
        run: zig fmt --check src/ build.zig
      - name: Zig build + tests
        run: zig build test --summary all
      - name: Zig build (ReleaseSafe)
        run: zig build -Doptimize=ReleaseSafe --summary all
      - name: E2E smoke (boot/login/shutdown, no panic/leak)
        run: |
          zig build --summary all
          bash scripts/run_e2e.sh

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run typecheck
        working-directory: web
      - run: pnpm run test
        working-directory: web
      - run: pnpm run build
        working-directory: web
